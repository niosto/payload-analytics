Resources:
  # Created empty on purpose. The value is set once from .envs/sls.env with
  # aws secretsmanager put-secret-value, so it never lands in the repo or in the
  # CloudFormation template.
  ServerlessAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /${self:custom.servicePrefix}/ServerlessAccessKey
      Description: Serverless Framework access key used by the GitHub Actions deploy job
