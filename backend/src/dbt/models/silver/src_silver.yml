sources:
  - name: silver
    schema: silver
    tables:
      - name: stg_customers
        identifier: stg_customers
        description: Table with customers' data (includes credit_info and digital_engagement as JSONB columns)
      - name: stg_accounts
        identifier: stg_accounts
        description: Table with accounts data
      - name: stg_transactions
        identifier: stg_transactions
        description: Table with transactions' data
      - name: stg_loans
        identifier: stg_loans
        description: Table with loans data
      - name: stream_fx_rates
        identifier: stream_fx_rates
        description: FX ticks written by the streaming job (one row per currency per tick, usd_per_unit like seed_fx_rates)
      - name: stream_transactions
        identifier: stream_transactions
        description: Live transactions written by the streaming job, joined with the FX tick in effect at event_time
